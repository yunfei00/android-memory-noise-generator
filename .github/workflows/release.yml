name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 36 build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches Android version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          if os.environ['TAG'] != f'v{version}':
              raise SystemExit('Tag must match Android versionName')
          PY

      - name: Build APK and run JVM tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Verify launcher application name
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "application-label:'Memory Noise'" /tmp/apk-badging.txt

      - name: Prepare release package
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          apk="dist/android-memory-noise-generator-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cp "$apk" "dist/package/android-memory-noise-generator-${TAG}.apk"
          cp USER_GUIDE_CN.md dist/package/USER_GUIDE_CN.md
          cp .github/release-notes.md dist/package/RELEASE_NOTES.md
          printf 'Android Memory Noise Generator\nVersion: %s\nCommit: %s\n' "$TAG" "$SHA" > dist/package/VERSION.txt
          (cd dist/package && sha256sum "android-memory-noise-generator-${TAG}.apk" > SHA256SUMS.txt)
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          tag = os.environ['TAG']
          package_dir = pathlib.Path('dist/package')
          zip_path = pathlib.Path('dist') / f'android-memory-noise-generator-{tag}-package.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(package_dir.iterdir()):
                  zf.write(path, arcname=path.name)
          PY
          sha256sum "$apk" "dist/android-memory-noise-generator-${TAG}-package.zip" > dist/SHA256SUMS.txt
          echo "===== Release files ====="
          ls -lh dist
          echo "===== Package contents ====="
          python3 -m zipfile -l "dist/android-memory-noise-generator-${TAG}-package.zip"

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="dist/android-memory-noise-generator-${TAG}.apk"
          package="dist/android-memory-noise-generator-${TAG}-package.zip"
          checksums="dist/SHA256SUMS.txt"
          title="Android Memory Noise Generator ${TAG}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" "$package" "$checksums" --clobber
            gh release edit "$TAG" --title "$title" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" "$apk" "$package" "$checksums" --verify-tag --title "$title" --notes-file .github/release-notes.md
          fi
