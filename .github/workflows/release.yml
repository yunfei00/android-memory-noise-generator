name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches Android version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          if os.environ['TAG'] != f'v{version}':
              raise SystemExit('Tag must match Android versionName')
          PY

      - name: Build APK and run JVM tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Prepare APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/android-memory-noise-generator-${TAG}.apk"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="dist/android-memory-noise-generator-${TAG}.apk"
          title="Android Memory Noise Generator ${TAG}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
            gh release edit "$TAG" --title "$title" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" "$apk" --verify-tag --title "$title" --notes-file .github/release-notes.md
          fi
